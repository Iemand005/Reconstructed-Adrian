<!DOCTYPE html>

<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>Birthday Counter</title>
  <style type="text/css">
        html, body {
            height: 100%;
            margin: 0;
            background-color: #222;
        }
    </style>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap');

    container {
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    p {
      text-align: center;
      position: absolute;
      top: 1.65em;
      font-size: 100px;
      font-family: "Roboto Condensed";
      border-top: 13px solid white;
      border-bottom: 13px solid white;
      color: white;
    }

    #x {
      background-color: rgba(0,0,0,0);
      font-family: "Roboto Condensed";
      color: white;
    }
  </style>
</head>
<body style="background: white;">
  <button id="x" ;="" onclick="thingy()" style="color: rgb(34, 34, 34); background: white;">x</button>
  <container>
    <p id="demo" style="color: rgb(34, 34, 34); border-top: 13px solid rgb(34, 34, 34); border-bottom: 13px solid rgb(34, 34, 34);">14d 8h 56m 40s </p>
  </container>
<script>
var countDownDate = new Date("Dec 23, 2021").getTime();
var x = setInterval(function() {
  var now=new Date().getTime();distance=countDownDate-now;days=Math.floor(distance/86400000);hours=Math.floor((distance%86400000)/3600000);minutes=Math.floor((distance%3600000)/60000);seconds=Math.floor((distance%60000)/1000);
  document.getElementById("demo").innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s `;
  if (distance < 0) {
    clearInterval(x);
    document.getElementById("demo").innerHTML = "HAPPY BIRTHDAY!!";
  }
}, 1000);

var isClicked = false;
function thingy() {
  isClicked = !isClicked;
  var x = document.body;
  var y = document.getElementById("x");
  var z = document.getElementById("demo");
  if (isClicked) {
    x.style.background = "white";
    y.style.color = "#222";
    z.style.color = "#222";
    z.style.borderTop = "13px solid #222";
    z.style.borderBottom = "13px solid #222";
  } else {
    x.style.background = "#222";
    y.style.background = "white";
    z.style.color = "white";
    z.style.borderTop = "13px solid white";
    z.style.borderBottom = "13px solid white";
  }
}
</script>
</body></html>
