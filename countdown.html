<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Birthday Counter</title>
    <style>

    @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap');

    html, body {
      height: 100%;
      margin: 0;
    }

    container {
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    p {
      text-align: center;
      position: absolute;
      top: 1.65em;
      font-size: 100px;
      font-family: "Roboto Condensed";
      border-top: 13px solid white;
      border-bottom: 13px solid white;
      color: white;
    }

    #x {
      background-color: rgba(0,0,0,0);
      font-family: "Roboto Condensed";
      color: white;
    }
  </style>
</head>
<body style="background: white;">
  <button onclick="thingy(this)" style="color: #222; background: white;border: none;margin: 6px;">☀</button>
  <container>
    <p id="thingie" style="color:#222; border-top: 13px solid; border-bottom: 13px solid;">14d 8h 56m 40s </p>
  </container>
<script>
var countDownDate = new Date("Dec 23, 2021").getTime();
var x = setInterval(function() {
  var now=new Date().getTime();distance=countDownDate-now;days=Math.floor(distance/86400000);hours=Math.floor((distance%86400000)/3600000);minutes=Math.floor((distance%3600000)/60000);seconds=Math.floor((distance%60000)/1000);
  document.getElementById("thingie").innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
  if (distance < 0) {
    clearInterval(x);
    document.getElementById("thingie").innerHTML = "HAPPY BIRTHDAY!!";
  }
}, 1000);

function thingy(butt) {
  var d=document;x=d.body;z=d.getElementById("thingie");
  if (butt.innerHTML=="☾") {
    butt.innerHTML="☀";butt.style.backgroundColor="white";butt.style.color="#222";
    x.style.background = "white";
    z.style.color="#222";
  } else {
    butt.innerHTML="☾";butt.style.backgroundColor="#222";butt.style.color="white";
    x.style.background = "#222";
    z.style.color="white";
  }
}
</script>
</body></html>
