<!DOCTYPE html>
<html><head></head><body>
  <style>
  body {
    background: #222;
  }
  .cube {
    top: 100px;
    left: 100px;
    transform-style: preserve-3d;
  width: 140px;
  height: 80px;
  position: relative;
  animation: spin 5s infinite linear;
}
.face {
  position: absolute;
  image-rendering: pixelated;
  background-color: blue;
}

.side {
  width: 140px;
  height: 80px;
  background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAIBAMAAAA7P9P/AAAAG1BMVEX//f6NQyTHYST26MunSyS7WB1/Oh399Njg07hlZYDcAAAAO0lEQVQI12MwZwCBYjhtXMBQzsBuzNAsUuxSLGLBkBLqqhSa4saQGKSk5KQqxpASqBSkFOrGkCYIAmkARJcLUDTrVAoAAAAASUVORK5CYII=');
  background-color: red;
  background-size:100% 100%;
}

.top {background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOBAMAAADtZjDiAAAAFVBMVEX//f799Nj26MvTIS3oNTWwITLwc1q0V7ubAAAAWElEQVQI1yWNsQ2AMBAD7wmiNl9Q80wQhFgARB9mgP1nIApyYVnW6VhGYFwIgOxoOEIY6lesph0FmG2TQVJ6c22UzrsDzHZ5ATxw0ENjdAUTRtDV5b/H/ANp6wZw1HSbeAAAAABJRU5ErkJggg==');background-size:100% 100%;width: 140px;height: 140px;transform: rotateX(90deg) translateZ(70px);}
.bottom {background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOAgMAAABiJsVCAAAADFBMVEV/Oh2NQyRrNCCnSyQVQXhRAAAASElEQVQI1w3HsQ2AIBRF0auBhBIKBnCTP8LDQFwDC/o/pAPJ6Q7xG1DHY/SrZV5cyE9hIU9ukpjpEJ1iVN9V8LnbRFnDiH3xA9voDVTuJx9NAAAAAElFTkSuQmCC');background-size:100% 100%;width: 140px;height: 140px;transform: rotateX(-90deg) translateZ(10px);}
.right {transform: rotateY(90deg) translateZ(70px);}
.left {transform: rotateY(-90deg) translateZ(70px);}
.front {transform: rotateX(0deg) translateZ(70px);}
.back {transform: rotateY(-180deg) translateZ(70px);}

@keyframes spin {
  from {transform: rotateX(-20deg) rotateY(0deg);}
  to {transform: rotateX(-20deg) rotateY(360deg);}
}
  </style>
  </script>
  <script src="./confetti.js"></script>
<script>confetti.start()</script>
<script>setTimeout(function(){confetti.stop();},3000)</script>
  <div class="container">
    <div class="cube">
      <div class="face front side"></div>
      <div class="face back side"></div>
      <div class="face right side"></div>
      <div class="face left side"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>
</body>
</html>
