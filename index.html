<!DOCTYPE html>
<html><head></head><body>
  <style>
  body {
    background: #222;
  }
  .cube {
    top: 100px;
    left: 100px;
    transform-style: preserve-3d;
  width: 140px;
  height: 80px;
  position: relative;
  animation: spin 5s infinite linear;
}
.face {
  position: absolute;
  background-size:100% 100%;
  image-rendering: pixelated;
  background-color: blue;
}

.side {
  width: 140px;
  height: 80px;
  background-size:100% 100%;
  background: url(./cake_side.png);
  background-color: red;
}

.top {background: url(./cake_top.png);width: 140px;height: 140px;transform: rotateX(90deg) translateZ(70px);}
.bottom {background: url(./cake_bottom.png);width: 140px;height: 140px;transform: rotateX(-90deg) translateZ(10px);}
.right {transform: rotateY(90deg) translateZ(70px);}
.left {transform: rotateY(-90deg) translateZ(70px);}
.front {transform: rotateX(0deg) translateZ(70px);}
.back {transform: rotateY(-180deg) translateZ(70px);}

@keyframes spin {
  from {transform: rotateX(-20deg) rotateY(0deg);}
  to {transform: rotateX(-20deg) rotateY(360deg);}
}
  </style>
  </script>
  <div class="container">
    <div class="cube">
      <div class="face front side"></div>
      <div class="face back side"></div>
      <div class="face right side"></div>
      <div class="face left side"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>
</body>
</html>
